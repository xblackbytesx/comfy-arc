name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/comfy-arc

jobs:
  build-push:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PyTorch XPU wheels plus the Intel runtime make for a large image, and a
      # hosted runner starts with little free space.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            # Full semver tag: v1.2.3
            type=semver,pattern={{version}}
            # Minor tag: 1.2
            type=semver,pattern={{major}}.{{minor}}
            # Major tag: 1
            type=semver,pattern={{major}}
            # rolling latest, on tag builds only: is_default_branch is false
            # for a tag push, so this has to test the ref type instead
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            # manual runs land under a commit tag rather than moving latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Intel Arc is x86 only, so one platform keeps builds quick.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
