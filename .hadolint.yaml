# Version pinning is handled deliberately in this repo, not by hadolint:
#   - dnf packages come from the live Fedora repos, which keep only the newest
#     build, so a pinned rpm would break the next build; the image records
#     what it got in /opt/comfy-arc-rpms.txt instead
#   - pip installs come from requirements.lock (exact versions plus hashes),
#     and later installs are held by /etc/comfy-arc-constraints.txt
#   - PIP_NO_CACHE_DIR is set once as an ENV rather than per install
ignored:
  - DL3041  # specify version with dnf install
  - DL3013  # pin versions in pip install
  - DL3042  # pip install without --no-cache-dir
